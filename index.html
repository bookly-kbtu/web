<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff596c" />
    <link rel="icon" type="image/png" href="/logo-square.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bookly" />
    <title>Bookly — салоны и мастера</title>
    <style>
      /* Splash: inline so it paints before the JS bundle arrives */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 42% at 12% 8%, #ffe9ee 0%, rgba(255, 233, 238, 0) 70%),
          radial-gradient(52% 36% at 88% 16%, #fff0e4 0%, rgba(255, 240, 228, 0) 70%),
          radial-gradient(75% 55% at 50% 104%, #ffe2e9 0%, rgba(255, 226, 233, 0) 72%),
          #fff8f9;
        transition: opacity 0.45s ease;
      }
      #splash img {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        box-shadow:
          0 18px 44px rgba(197, 46, 73, 0.22),
          0 0 0 18px rgba(255, 89, 108, 0.05),
          0 0 0 38px rgba(255, 89, 108, 0.025);
        animation: splash-breathe 1.7s ease-in-out infinite;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/logo-square.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
